[package]
name         = "base94-simd"
version      = "0.1.1"
edition      = "2024"
rust-version = "1.85"
description  = "SIMD-accelerated base94 codec"
readme       = "README.md"
homepage     = "https://github.com/lxl66566/nextppp/tree/main/crates/base94"
repository   = "https://github.com/lxl66566/nextppp"
license      = "MIT OR Apache-2.0"
keywords     = ["ascii", "base94", "encoding", "printable", "simd"]
categories   = ["encoding"]
exclude      = ["fuzz"]

[lints.clippy]
all                     = { level = "warn", priority = -1 }
cargo                   = { level = "warn", priority = -1 }
doc_markdown            = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
multiple_crate_versions = "allow"
pedantic                = { level = "warn", priority = -1 }
wildcard_imports        = "allow"

[lints.rust]
unsafe_code           = "allow"
unused_qualifications = "warn"

[features]
# Profiling instrumentation (noop and zero-cost when off); the encode/decode
# entry points are the hottest functions in the nextppp data plane.
hotpath = ["dep:hotpath", "hotpath/hotpath"]

[dependencies]
hotpath = { version = "0.23", optional = true }
