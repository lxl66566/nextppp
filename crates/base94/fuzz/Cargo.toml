[package]
name    = "base94-simd-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[[bin]]
doc  = false
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false

[[bin]]
doc  = false
name = "decode_matches_reference"
path = "fuzz_targets/decode_matches_reference.rs"
test = false

[[bin]]
doc  = false
name = "encode_matches_reference"
path = "fuzz_targets/encode_matches_reference.rs"
test = false

[[bin]]
doc  = false
name = "decimal_roundtrip"
path = "fuzz_targets/decimal_roundtrip.rs"
test = false

[[bin]]
doc  = false
name = "framer_roundtrip"
path = "fuzz_targets/framer_roundtrip.rs"
test = false

[dependencies]
base94-simd   = { path = ".." }
libfuzzer-sys = "0.4"
nextppp-core  = { path = "../../core" }
rand          = "0.10"
