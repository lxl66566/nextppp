[package]
name        = "nextppp-common"
description = "Shared building blocks for the nextppp proxy server and client"
readme      = "../../README.md"
keywords    = ["anti-censorship", "network", "openppp2", "proxy"]
categories  = ["network-programming"]

version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
repository.workspace   = true
license.workspace      = true

[dependencies]
anyhow       = { workspace = true }
hotpath      = { workspace = true, optional = true }
json5        = { workspace = true }
nextppp-core = { workspace = true }
serde        = { workspace = true }
spdlog-rs    = { workspace = true }
thiserror    = { workspace = true }

[features]
# Profiling instrumentation; see nextppp-core's feature docs.
hotpath       = ["dep:hotpath", "hotpath/hotpath", "nextppp-core/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc", "nextppp-core/hotpath-alloc"]
hotpath-cpu   = ["hotpath", "hotpath/hotpath-cpu", "nextppp-core/hotpath-cpu"]

[lints]
workspace = true
