[package]
name        = "openppp3-common"
description = "Shared building blocks for the openppp3 proxy server and client"
readme      = "../../README.md"
keywords    = ["anti-censorship", "network", "openppp2", "proxy"]
categories  = ["network-programming"]

version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
repository.workspace   = true
license.workspace      = true

[dependencies]
hotpath       = { workspace = true, optional = true }
json5         = { workspace = true }
openppp3-core = { workspace = true }
serde         = { workspace = true }
spdlog-rs     = { workspace = true }
thiserror     = { workspace = true }

[features]
# Profiling instrumentation; see openppp3-core's feature docs.
hotpath       = ["dep:hotpath", "hotpath/hotpath", "openppp3-core/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc", "openppp3-core/hotpath-alloc"]
hotpath-cpu   = ["hotpath", "hotpath/hotpath-cpu", "openppp3-core/hotpath-cpu"]

[lints]
workspace = true
