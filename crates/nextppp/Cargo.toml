[package]
name        = "nextppp"
description = "nextppp anti-censorship proxy (unified server/client binary)"
readme      = "../../README.md"
keywords    = ["anti-censorship", "network", "openppp2", "proxy"]
categories  = ["network-programming"]

version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
repository.workspace   = true
license.workspace      = true

[dependencies]
anyhow         = { workspace = true }
clap           = { workspace = true }
hotpath        = { workspace = true, optional = true }
nextppp-client = { workspace = true }
nextppp-common = { workspace = true }
nextppp-server = { workspace = true }
spdlog-rs      = { workspace = true }

[features]
# Profiling instrumentation; see nextppp-core's feature docs. With the
# feature on, a localhost metrics server (port 6770) also comes up for the
# hotpath TUI while the process runs.
hotpath       = [
  "dep:hotpath",
  "hotpath/hotpath",
  "nextppp-client/hotpath",
  "nextppp-server/hotpath",
]
hotpath-alloc = [
  "hotpath",
  "hotpath/hotpath-alloc",
  "nextppp-client/hotpath-alloc",
  "nextppp-server/hotpath-alloc",
]
hotpath-cpu   = [
  "hotpath",
  "hotpath/hotpath-cpu",
  "nextppp-client/hotpath-cpu",
  "nextppp-server/hotpath-cpu",
]

[lints]
workspace = true
