[package]
name        = "nextppp-server"
description = "nextppp anti-censorship proxy server"
readme      = "../../README.md"
keywords    = ["anti-censorship", "network", "openppp2", "proxy"]
categories  = ["network-programming"]

version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
repository.workspace   = true
license.workspace      = true

[dependencies]
anyhow         = { workspace = true }
hotpath        = { workspace = true, optional = true }
nextppp-common = { workspace = true }
nextppp-core   = { workspace = true }
rand           = { workspace = true }
spdlog-rs      = { workspace = true }

[features]
# Profiling instrumentation; see nextppp-core's feature docs.
hotpath       = ["dep:hotpath", "hotpath/hotpath", "nextppp-common/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc", "nextppp-common/hotpath-alloc"]
hotpath-cpu   = ["hotpath", "hotpath/hotpath-cpu", "nextppp-common/hotpath-cpu"]

[lints]
workspace = true
